# Runbook-owned defaults for a generated Host JOIN profile.
# Core/DAPI executable versions and commits come from identity-bound Bootstrap
# seed and public peer observations. DAPI is selected by strict majority, Core
# by strict majority within that DAPI cohort, and the observed pair must meet
# the reviewed local quorum: two observations on Community DevNet and three on
# larger or unknown networks. This immutable official Compose snapshot provides a
# compatible Host container baseline, but is accepted only when its Core image
# tag matches the observed Core version. It cannot select a release, DAPI
# binary, candidate, or per-network policy.
