events {}
http {
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  upstream mlnode_api {
    zone mlnode_api 64k;
    server mlnode:8080 resolve;
  }
  upstream mlnode_vllm {
    zone mlnode_vllm 64k;
    server mlnode:5000 resolve;
  }

  server {
    listen 8080;
    client_max_body_size 0;
    proxy_connect_timeout 24h;
    proxy_send_timeout 24h;
    proxy_read_timeout 24h;
    # The current MLNode control API is rooted at /api/v1. Preserve that
    # prefix when proxying; the legacy catch-all below intentionally strips
    # its path for older /v3.0.8 callers.
    location /api/ { proxy_pass http://mlnode_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /v3.0.8/ { proxy_pass http://mlnode_api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://mlnode_api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }

  server {
    listen 5000;
    client_max_body_size 0;
    proxy_connect_timeout 24h;
    proxy_send_timeout 24h;
    proxy_read_timeout 24h;
    # Physical node4 reaches this ML-only host through a provider firewall
    # that exposes 5000 but not 8080. Keep inference and PoC control on the
    # same allowed port, split by path.
    location /v3.0.8/api/ { proxy_pass http://mlnode_api/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /v3.0.8/ { proxy_pass http://mlnode_vllm/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://mlnode_vllm/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }
}
