services:
  bot:
    build: .
    restart: unless-stopped
    env_file: [./bot.env]
    network_mode: host
    volumes:
      - ./data:/data
      - /var/lib/node_exporter/textfile_collector:/metrics
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:9464/health', timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
