# A monitoring agent is part of one managed Host deployment.  Its project name
# must therefore be supplied by the rendered Host environment instead of being
# shared by every validator on the machine.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}
services:
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.9.1}
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=0.0.0.0:9101
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/textfile:ro

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.54.1}
    restart: unless-stopped
    privileged: true
    ports:
      - 0.0.0.0:8088:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
