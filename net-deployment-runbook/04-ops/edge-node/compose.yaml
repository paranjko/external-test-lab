name: gdc-edge
services:
  public-grafana:
    profiles: ["public-edge"]
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE is required}
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Compose interpolates every service, including this public-edge-only service
      # when a regular Network Node starts only `caddy`.  A harmless default
      # keeps those local deployments independent of public-edge variables;
      # the public edge renderer always supplies the canonical hostname.
      GF_SERVER_DOMAIN: ${GRAFANA_HOST:-localhost}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-localhost}/
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gdc-network.json
    volumes:
      - ./public-grafana/provisioning:/etc/grafana/provisioning:ro
      - ./public-grafana/dashboards:/var/lib/grafana/dashboards:ro

  gateway-admission:
    image: ${PYTHON_IMAGE:-python:3.13-alpine}
    restart: unless-stopped
    network_mode: host
    # This contract is selected by `gateway apply`, independently from the
    # Caddy/Grafana operator profile in .env.
    env_file: [./gateway-admission.env]
    command: ["python3", "/edge/gateway-admission-proxy.py"]
    volumes:
      - ./gateway-admission-proxy.py:/edge/gateway-admission-proxy.py:ro
      - ./status:/edge/status

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
      PUBLIC_EDGE: ${PUBLIC_EDGE:-false}
      SITE_HOST: ${SITE_HOST:-}
      API_HOST: ${API_HOST:-}
      GRAFANA_HOST: ${GRAFANA_HOST:-}
      GATEWAY_PUBLIC_HOST: ${GATEWAY_PUBLIC_HOST:-}
      TELEGRAM_BOT_PUBLIC_HOST: ${TELEGRAM_BOT_PUBLIC_HOST:-}
      PUBLIC_EDGE_HOST: ${PUBLIC_EDGE_HOST:-}
      MONITORING_CIDR: ${MONITORING_CIDR:-127.0.0.1/32}
      PUBLIC_EDGE_CIDR: ${PUBLIC_EDGE_CIDR:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/edge:ro
      - ./site:/srv/dai/edge/site:ro
      - /srv/dai/caddy/data:/data
      - /srv/dai/caddy/config:/config
