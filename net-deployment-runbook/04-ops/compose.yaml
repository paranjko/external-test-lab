name: gdc-ops
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.3}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 0.0.0.0:9099:9090
    extra_hosts:
      - host.docker.internal:host-gateway

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.32.1}
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - 127.0.0.1:9093:9093

  blackbox:
    image: ${BLACKBOX_IMAGE:-prom/blackbox-exporter:v0.27.0}
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana is published through the configured public TLS edge, not directly
      # through the configured public edge. This keeps login redirects and browser API requests on
      # the same public origin.
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 0.0.0.0:3000:3000
    depends_on: [prometheus]

  devshard-gateway:
    image: ${LOCAL_GATEWAY_IMAGE:-gdc/devshard-gateway:0.2.15-v4}
    restart: unless-stopped
    env_file: [./gateway.env]
    volumes:
      # DevShard persists protocol-specific session state. Never mount the v3
      # and v4 gateways over the same state store: each runtime rejects a
      # recovered escrow belonging to the other protocol major.
      - ${DEVSHARD_GATEWAY_DATA_VOLUME:-gateway-data-v4}:/root/.devshardctl
    network_mode: host
    healthcheck:
      # A listening gateway with an empty runtime set returns a successful
      # status response but cannot accept inference. Treat it as unhealthy
      # until at least one model is genuinely routable.
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:18080/v1/status
          | grep -Eq '"routable"[[:space:]]*:[[:space:]]*true'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    network_mode: host
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      SITE_HOST: ${SITE_HOST:?SITE_HOST is required}
      API_HOST: ${API_HOST:?API_HOST is required}
      GRAFANA_HOST: ${GRAFANA_HOST:?GRAFANA_HOST is required}
      GATEWAY_PUBLIC_HOST: ${GATEWAY_PUBLIC_HOST:?GATEWAY_PUBLIC_HOST is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./status:/status:ro
      - /srv/dai/caddy/data:/data
      - /srv/dai/caddy/config:/config

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  gateway-data-v3:
  gateway-data-v4:
