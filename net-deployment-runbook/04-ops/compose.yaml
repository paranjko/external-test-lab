name: gdc-ops
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.3}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 0.0.0.0:9099:9090
    extra_hosts:
      - host.docker.internal:host-gateway

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.32.1}
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - 127.0.0.1:9093:9093

  blackbox:
    image: ${BLACKBOX_IMAGE:-prom/blackbox-exporter:v0.27.0}
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # `docker compose up caddy|gateway` still interpolates this unrelated
      # service. The runbook monitoring phase enforces the real OPS-owned
      # password before Grafana can start; an empty value must not couple
      # Gateway lifecycle to OPS credentials.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-unused-outside-monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana is published through the configured public TLS edge, not directly
      # through the configured public edge. This keeps login redirects and browser API requests on
      # the same public origin.
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 0.0.0.0:3000:3000
    depends_on: [prometheus]

  devshard-gateway:
    image: ${LOCAL_GATEWAY_IMAGE:-gdc/devshard-gateway:0.2.15-v4}
    restart: unless-stopped
    env_file: ["${GDC_GATEWAY_ENV_FILE:-./gateway.env}"]
    volumes:
      # DevShard persists protocol-specific session state. Never mount v3, v4
      # and v5 gateways over the same state store: each runtime rejects a
      # recovered escrow belonging to another protocol major.
      - ${DEVSHARD_GATEWAY_DATA_VOLUME:-gateway-data-v4}:/root/.devshardctl
      - ./gateway-status-routable.sh:/usr/local/bin/gateway-status-routable.sh:ro
    network_mode: host
    healthcheck:
      # A listening gateway with an empty runtime set returns a successful
      # status response but cannot accept inference. Treat it as unhealthy
      # until at least one model is genuinely routable.
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:$${DEVSHARD_PORT}/v1/status
          | grep -Eq '"routable"[[:space:]]*:[[:space:]]*true'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  bifrost:
    # The digest is the tested official transports/v2.2.4 release artifact.
    image: maximhq/bifrost@sha256:5f8215163cea192451f4b2ee5e0b583874ffe9435a5ab733e08c07aaf38ace57
    restart: unless-stopped
    env_file:
      - path: ./bifrost.env
        required: false
    network_mode: host
    volumes:
      - bifrost-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9464/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  bifrost-broker:
    build:
      context: .
      dockerfile: Dockerfile.bifrost-broker
    restart: unless-stopped
    env_file:
      - path: ./bifrost-broker.env
        required: false
    network_mode: host
    volumes:
      - bifrost-broker-data:/var/lib/bifrost-broker
      # The binding contains only Bifrost object IDs, never credentials. Mount
      # it as one read-only file so the broker cannot traverse OPS secrets.
      - ./bifrost/broker-binding.env:/run/bifrost/broker-binding.env:ro
    depends_on:
      bifrost:
        condition: service_healthy
      bifrost-broker-init:
        condition: service_completed_successfully

  bifrost-edge:
    build:
      context: .
      dockerfile: Dockerfile.bifrost-edge
    restart: unless-stopped
    env_file:
      - path: ./bifrost-edge.env
        required: false
    network_mode: host
    depends_on:
      bifrost-broker:
        condition: service_started

  bifrost-broker-init:
    build:
      context: .
      dockerfile: Dockerfile.bifrost-broker
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "install -d -o 65532 -g 65532 -m 0700 /var/lib/bifrost-broker"]
    volumes:
      - bifrost-broker-data:/var/lib/bifrost-broker

  faucet:
    build:
      context: ./faucet
      args:
        INFERENCED_IMAGE: ${INFERENCED_IMAGE:?INFERENCED_IMAGE is required}
    restart: unless-stopped
    env_file: [./faucet.env]
    network_mode: host
    volumes:
      - /srv/dai/gonka-devnet-faucet/operator-home:/home/faucet/.inference
      - /srv/dai/gonka-devnet-faucet/data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:18081/health', timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway-reserve-signer:
    profiles: [gateway-reserve]
    build:
      context: ./faucet
      args:
        INFERENCED_IMAGE: ${INFERENCED_IMAGE:?INFERENCED_IMAGE is required}
    restart: unless-stopped
    env_file: [./gateway-reserve-signer.env]
    network_mode: host
    volumes:
      - /srv/dai/gonka-devnet-faucet/operator-home:/home/faucet/.inference:ro
      - /srv/dai/gonka-devnet-gateway-reserve/data:/data

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    network_mode: host
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      SITE_HOST: ${SITE_HOST:?SITE_HOST is required}
      API_HOST: ${API_HOST:?API_HOST is required}
      GRAFANA_HOST: ${GRAFANA_HOST:?GRAFANA_HOST is required}
      GATEWAY_PUBLIC_HOST: ${GATEWAY_PUBLIC_HOST:?GATEWAY_PUBLIC_HOST is required}
      PUBLIC_EDGE_CIDR: ${PUBLIC_EDGE_CIDR:?PUBLIC_EDGE_CIDR is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./:/ops:ro
      - ./status:/status:ro
      - /srv/dai/caddy/data:/data
      - /srv/dai/caddy/config:/config

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  gateway-data-v3:
    name: ${DEVSHARD_GATEWAY_DATA_VOLUME_V3_NAME:-gdc-ops_gateway-data-v3}
  gateway-data-v4:
    name: ${DEVSHARD_GATEWAY_DATA_VOLUME_V4_NAME:-gdc-ops_gateway-data-v4}
  gateway-data-v5:
    name: ${DEVSHARD_GATEWAY_DATA_VOLUME_V5_NAME:-gdc-ops_gateway-data-v5}
  bifrost-data:
    name: ${BIFROST_DATA_VOLUME_NAME:-gdc-ops_bifrost-data}
  bifrost-broker-data:
    name: ${BIFROST_BROKER_DATA_VOLUME_NAME:-gdc-ops_bifrost-broker-data}
