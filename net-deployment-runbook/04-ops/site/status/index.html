<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Read-only public status API for Gonka Community DevNet">
  <title>Gonka Community DevNet Status API</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/swagger-ui/swagger-ui.css">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #fff; color: #3b4151; }
    #swagger-ui { max-width: 1280px; margin: 0 auto; }
    .api-nav { padding: 18px 24px; font: 14px/1.5 sans-serif; }
    .api-nav a { color: #174ea6; }
  </style>
</head>
<body>
  <header class="api-nav"><a href="/">Gonka Community DevNet</a> / public status API · <a href="/status/openapi.json">OpenAPI JSON</a></header>
  <main id="swagger-ui"></main>
  <script src="/vendor/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="/vendor/swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/status/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      displayRequestDuration: true,
      tryItOutEnabled: true,
      supportedSubmitMethods: ["get"],
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "BaseLayout"
    });
  </script>
</body>
</html>
