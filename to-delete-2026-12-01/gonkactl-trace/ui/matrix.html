<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gonka · state matrix prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#203246;font:14px system-ui}header{padding:14px 24px;background:#203246;color:white;display:flex;justify-content:space-between;gap:20px}header a{color:white}main{padding:20px 24px}h1{font-size:26px;margin:0 0 8px}h2{font-size:19px}h3{font-size:16px}.subtitle,.note{color:#526477}.summary{background:#fff;border-left:4px solid #526477;padding:6px 16px;margin:16px 0}.layout{display:grid;grid-template-columns:minmax(600px,1.6fr) minmax(320px,1fr);gap:20px;align-items:start}table{border-collapse:collapse;width:100%;background:#fff}td,th{border:1px solid #d6dfe8;padding:8px;text-align:left;vertical-align:top}thead{background:#e8edf3}th small{font-weight:normal}.cell{width:100%;text-align:left;background:#f7fafd;border:1px solid transparent;border-radius:4px;padding:10px;cursor:pointer;color:inherit}.cell:hover{border-color:#59789a}.cell[aria-pressed=true]{outline:2px solid #234f7d;background:#e8f0f9}.cell.absent{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#f2f4f6 6px,#f2f4f6 8px)}small{display:block;margin-top:7px;font-size:12px;line-height:1.4}.uncertain{color:#725e2d}aside{background:white;border:1px solid #d6dfe8;padding:16px;max-height:75vh;overflow:auto}aside h2{margin-top:0}.state{font-size:18px}details{margin:10px 0;border:1px solid #d6dfe8;padding:10px;background:#fff}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7fa;padding:10px}button{font:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b37300}a{color:#234f7d}@media(max-width:1000px){.layout{display:block}.layout>section{overflow:auto}aside{margin-top:16px;max-height:none}main{padding:12px}}
</style>
<style>
header{flex-wrap:wrap;align-items:center}select{font:inherit;padding:4px}.causal-story{max-width:1200px;margin:20px auto 28px}.causal-story>p{font-size:17px;line-height:1.6}.causal-flow{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;counter-reset:steps}.causal-flow>li{background:white;border:1px solid #ccd8e4;border-top:4px solid #527498;padding:14px 18px;min-width:0}.causal-flow>li:nth-child(even){background:#f0f2f5}.causal-flow>li:last-child{border-top-color:#ab4040}.causal-flow h3{margin-top:0}.causal-flow p{line-height:1.6}.vote-line span{display:inline-block;padding:3px 6px;margin:3px;border-radius:4px}.vote-yes{background:#e1f2e6;color:#235433}.vote-missing{background:#fbe4dd;color:#842f25}.quorum-bar{position:relative;display:flex;height:58px;margin:40px 0 16px;font-weight:600}.quorum-available,.quorum-missing{display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden}.quorum-available{background:#d5e9db}.quorum-missing{background:repeating-linear-gradient(135deg,#f7d9d9,#f7d9d9 7px,#fceaea 7px,#fceaea 14px)}.quorum-marker{position:absolute;border-left:3px solid #8f2525;height:83px;top:-25px;white-space:nowrap;padding-left:5px;color:#8f2525}.summary,td,th{overflow-wrap:anywhere}@media(max-width:800px){.causal-flow{grid-template-columns:1fr}.quorum-bar{font-size:12px}.quorum-marker{font-size:12px}.causal-story>p{font-size:15px}}
</style>
<header><strong id="brand">Gonka · incident investigation · prototype</strong><a id="timeline">Open detailed timeline in Perfetto</a><label>Язык / Language <select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label></header>
<main id="matrix" aria-live="polite">Loading four-height state comparison…</main>
<script type="module" src="/gonka/matrix.mjs"></script>
</html>
