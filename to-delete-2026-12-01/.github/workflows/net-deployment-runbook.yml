name: Net deployment runbook

on:
  push:
    branches:
      - main
    paths:
      - 'net-deployment-runbook/**'
      - 'model/**'
      - 'broker-ops/**'
      - 'install_inferenced.sh'
      - 'ops/preview/**'
      - 'schema/**'
      - 'bootstrap/**'
      - 'ops/chore/setup-bootstrap-publisher.sh'
      - '.github/workflows/network-bootstrap-publish.yml'
      - '.github/workflows/network-bootstrap-monitor.yml'
      - '.github/workflows/net-deployment-runbook.yml'
      - '.github/workflows/devshard-release.yml'
      - '.github/workflows/devshard-artifacts-release.yml'
      - '.github/workflows/gonka-pr-unified-release.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'net-deployment-runbook/**'
      - 'model/**'
      - 'broker-ops/**'
      - 'install_inferenced.sh'
      - 'ops/preview/**'
      - 'schema/**'
      - 'bootstrap/**'
      - 'ops/chore/setup-bootstrap-publisher.sh'
      - '.github/workflows/network-bootstrap-publish.yml'
      - '.github/workflows/network-bootstrap-monitor.yml'
      - '.github/workflows/net-deployment-runbook.yml'
      - '.github/workflows/devshard-release.yml'
      - '.github/workflows/devshard-artifacts-release.yml'
      - '.github/workflows/gonka-pr-unified-release.yml'
  workflow_dispatch:

concurrency:
  group: net-deployment-runbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.route.outputs.groups }}
      required: ${{ steps.route.outputs.required }}
      release_checks: ${{ steps.route.outputs.release_checks }}
      shellcheck: ${{ steps.route.outputs.shellcheck }}
      runbook_tests: ${{ steps.route.outputs.runbook_tests }}
      host_lifecycle: ${{ steps.route.outputs.host_lifecycle }}
      public_edge_integration: ${{ steps.route.outputs.public_edge_integration }}
      ownership: ${{ steps.route.outputs.ownership }}
      upstream_profiles: ${{ steps.route.outputs.upstream_profiles }}
      host_upgrade_lifecycle: ${{ steps.route.outputs.host_upgrade_lifecycle }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: files
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            await require('fs').promises.writeFile(
              `${process.env.RUNNER_TEMP}/changed-files.json`,
              // The API caps PR file lists at 3000. An empty list requests
              // the full suite instead of trusting potentially truncated data.
              JSON.stringify(files.length >= 3000 ? [] : files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean))));
      - id: route
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.before }}
          CI_HEAD: ${{ github.sha }}
          CI_CHANGED_FILES: ${{ runner.temp }}/changed-files.json
        run: make -C net-deployment-runbook ci-route

  release-checks:
    name: Release checks
    needs: route
    if: needs.route.outputs.release_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release tooling and declared dependencies
        run: make -C net-deployment-runbook test-command-dependency-contract test-ci-route test-devshard-release test-devshard-artifacts test-gonka-pr-unified-release test-ci-release-helpers

  shellcheck:
    needs: route
    if: needs.route.outputs.shellcheck == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check runbook shell scripts
        run: make -C net-deployment-runbook shellcheck shellcheck_shard=${{ matrix.shard }} shellcheck_shards=2

  runbook-tests:
    name: Runbook tests (${{ matrix.group }})
    needs: route
    if: needs.route.outputs.runbook_tests == 'true'
    runs-on: ${{ vars.GDC_NODE4_RUNNER_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON('["self-hosted", "linux", "x64", "gdc-node4"]') || 'ubuntu-latest' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && 'gdc-node4-runner' || '' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.route.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python for schema contracts
        if: matrix.group == 'bootstrap' || matrix.group == 'core' || matrix.group == 'join'
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.12'
      - name: Install Bootstrap schema test dependency
        if: matrix.group == 'bootstrap' || matrix.group == 'core' || matrix.group == 'join'
        run: make -C net-deployment-runbook bootstrap-schema-dependencies
      - name: Install declared Python test dependencies
        if: matrix.group == 'gateways'
        run: make -C net-deployment-runbook install-python-test-dependencies
      - name: Verify CI group coverage
        run: make -C net-deployment-runbook test-ci-layout
      - name: Run runbook tests
        run: make -C net-deployment-runbook test-ci-${{ matrix.group }}

  # Every selected job must succeed, including on pushes and manual runs.
  runbook-checks:
    name: Runbook checks
    needs: [route, release-checks, shellcheck, runbook-tests, host-lifecycle, public-edge-integration, ownership, upstream-profiles, host-upgrade-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify selected checks completed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REQUIRED: ${{ needs.route.outputs.required }}
        run: make -C net-deployment-runbook ci-result

  host-upgrade-lifecycle:
    needs: route
    if: needs.route.outputs.host_upgrade_lifecycle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test isolated Host upgrade and rollback
        run: make -C net-deployment-runbook test-host-upgrade-lifecycle

  ownership:
    needs: route
    if: needs.route.outputs.ownership == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test edge installation ownership in disposable root
        run: sudo make -C net-deployment-runbook test-edge-install-ownership
      - name: Test bootstrap publication with separate directory owners
        run: sudo make -C net-deployment-runbook test-bootstrap-publisher-ownership

  host-lifecycle:
    needs: route
    if: needs.route.outputs.host_lifecycle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test isolated Host JOIN and ML lifecycle
        run: make -C net-deployment-runbook test-host-lifecycle
      - name: Test existing service repair without restarting consensus
        run: make test-service-repair

  upstream-profiles:
    needs: route
    if: needs.route.outputs.upstream_profiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout Gonka release refs for upstream audit
        uses: actions/checkout@v7.0.1
        with:
          repository: gonka-ai/gonka
          path: net-deployment-runbook/.data/upstream/gonka
          fetch-depth: 0
      - name: Verify release profiles against upstream
        run: make -C net-deployment-runbook verify-upstream-profiles

  public-edge-integration:
    needs: route
    if: needs.route.outputs.public_edge_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test public edge routing in disposable containers
        run: make -C net-deployment-runbook edge-integration
      - name: Test Bootstrap JOIN installation in a disposable root
        run: make -C net-deployment-runbook test-bootstrap-install
