name: Candidate build
run-name: candidate ${{ inputs.candidate_profile }} ${{ inputs.candidate_definition_sha256 }}

on:
  workflow_dispatch:
    inputs:
      candidate_profile:
        description: Immutable laboratory candidate profile
        required: true
        type: string
      candidate_definition_sha256:
        description: SHA-256 of the tracked candidate definition
        required: true
        type: string

concurrency:
  group: candidate-request-${{ inputs.candidate_profile }}-${{ inputs.candidate_definition_sha256 }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  request:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.GDC_NODE4_RUNNER_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON('["self-hosted", "linux", "x64", "gdc-node4"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout exact reviewed request
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and record publication request
        env:
          PROFILE: ${{ inputs.candidate_profile }}
          EXPECTED_SHA256: ${{ inputs.candidate_definition_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$PROFILE" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-rc\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          definition="net-deployment-runbook/profiles/candidates/$PROFILE.definition.json"
          [[ -f "$definition" ]]
          actual_sha256="$(sha256sum "$definition" | awk '{print $1}')"
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]] || {
            echo 'candidate definition checksum mismatch' >&2
            exit 1
          }
          jq -n \
            --arg profile "$PROFILE" \
            --arg definition_sha256 "$EXPECTED_SHA256" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg request_run_id "$GITHUB_RUN_ID" '
              {
                schema_version: 1,
                kind: "external-test-lab-candidate-publication-request",
                profile: $profile,
                definition_sha256: $definition_sha256,
                repository: $repository,
                ref: $ref,
                sha: $sha,
                request_run_id: $request_run_id
              }
            ' >publication-request.json
      - name: Upload publication request
        uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-publication-request
          path: publication-request.json
          if-no-files-found: error
          retention-days: 7
