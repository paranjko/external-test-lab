name: Release gonkactl-trace

on:
  push:
    tags: ['gonkactl-trace-v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        default: gonkactl-trace-v1.0.0-beta.1
        type: choice
        options: [gonkactl-trace-v1.0.0-beta.1]

permissions:
  contents: read

concurrency:
  group: gonkactl-trace-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: gonkactl-trace/go.sum
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: make -C gonkactl-trace ui-deps
      - name: Verify source and installer
        run: make -C gonkactl-trace all demo
      - name: Package five reproducible targets
        env:
          TRACE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: make -C gonkactl-trace release-archives
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: gonkactl-trace-release
          path: gonkactl-trace/.cache/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: gonkactl-trace-release
          path: gonkactl-trace/.cache/release/
      - name: Verify tag and checksums, then publish beta notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TRACE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: make -C gonkactl-trace release-publish
