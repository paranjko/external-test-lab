name: DevShard archive release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devshard-archive-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'paranjko/external-test-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.3.0
        with:
          go-version: '1.25.9'
          cache: false
      - name: Install ELF inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Test release contracts
        run: make -C net-deployment-runbook test-devshard-release
      - name: Fetch pinned public source
        env:
          DEVSHARD_SOURCE: ${{ runner.temp }}/gonka-release-source
        run: make -C net-deployment-runbook devshard-release-fetch
      - name: Build and verify frozen archive
        env:
          DEVSHARD_SOURCE: ${{ runner.temp }}/gonka-release-source
        run: make -C net-deployment-runbook devshard-release-build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: devshard-release
          path: net-deployment-runbook/.data/devshard-release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.3.0
        with:
          go-version: '1.25.9'
          cache: false
      - name: Install ELF inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils
      - uses: actions/download-artifact@v8.0.1
        with:
          name: devshard-release
          path: net-deployment-runbook/.data/devshard-release/
      - name: Verify and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C net-deployment-runbook devshard-release-publish
