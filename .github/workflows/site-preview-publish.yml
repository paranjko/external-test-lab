name: Publish status-site preview

on:
  workflow_run:
    workflows: [Build status-site preview]
    types: [completed]
  pull_request:
    types: [closed, converted_to_draft]

concurrency:
  group: gonka-dev-site-preview-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  # Queue related events; a skipped build must not cancel preview cleanup
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write
  issues: write
  pull-requests: read

jobs:
  publish-context:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pr.outputs.publish }}
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C trusted/net-deployment-runbook site-preview-publish-context

  publish:
    needs: publish-context
    if: needs.publish-context.outputs.publish == 'true'
    name: Publish PR preview
    runs-on: ubuntu-latest
    environment:
      name: gonka-dev-site-preview
      url: https://preview.gonka-dev.net/${{ needs.publish-context.outputs.number }}/
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Download the untrusted source-bound artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: gonka-dev-site-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gonka-dev-site-preview

      - name: Verify the selected artifact through trusted scripts
        env:
          site_release_dir: ${{ runner.temp }}/gonka-dev-site-preview
          preview_number: ${{ needs.publish-context.outputs.number }}
          preview_base_revision: ${{ needs.publish-context.outputs.base_sha }}
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
          preview_backend_image: gdc-preview-backend-ci:${{ needs.publish-context.outputs.head_sha }}
        run: make -C trusted/net-deployment-runbook verify-isolated-preview-ci-artifact

      - name: Materialize the publisher configuration
        env:
          DEPLOY_HOST: ${{ secrets.GONKA_DEV_PREVIEW_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GONKA_DEV_PREVIEW_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.GONKA_DEV_PREVIEW_DEPLOY_PRIVATE_KEY }}
          DEPLOY_USER: preview
          PREVIEW_PROMETHEUS_ORIGIN: ${{ secrets.GONKA_DEV_PREVIEW_PROMETHEUS_ORIGIN }}
          PREVIEW_DEPLOY_ENV_FILE: ${{ runner.temp }}/gonka-dev-site-preview-deploy/config.env
        run: make -C trusted/net-deployment-runbook write-isolated-preview-deploy-env

      - name: Publish the source-bound preview without executing PR host code
        env:
          GDC_SITE_PREVIEW_ENV_FILE: ${{ runner.temp }}/gonka-dev-site-preview-deploy/config.env
          site_release_dir: ${{ runner.temp }}/gonka-dev-site-preview
          preview_number: ${{ needs.publish-context.outputs.number }}
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
          preview_backend_image: gdc-preview-backend-ci:${{ needs.publish-context.outputs.head_sha }}
        run: make -C trusted/net-deployment-runbook publish-isolated-preview-ci

      - name: Verify the public source-bound preview before reporting it
        env:
          PREVIEW_ORIGIN: https://preview.gonka-dev.net
          preview_number: ${{ needs.publish-context.outputs.number }}
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
          site_release_dir: ${{ runner.temp }}/gonka-dev-site-preview
        run: make -C trusted/net-deployment-runbook verify-isolated-site-preview-live

      - name: Record the verified preview for the PR revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          preview_number: ${{ needs.publish-context.outputs.number }}
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
          PREVIEW_ORIGIN: https://preview.gonka-dev.net
        run: make -C trusted/net-deployment-runbook record-site-preview-deployment

  cleanup-context:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      remove: ${{ steps.pr.outputs.remove }}
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C trusted/net-deployment-runbook site-preview-cleanup-context

  cleanup:
    needs: cleanup-context
    if: needs.cleanup-context.outputs.remove == 'true'
    name: Remove PR preview
    runs-on: ubuntu-latest
    environment: gonka-dev-site-preview
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Materialize the publisher configuration
        env:
          DEPLOY_HOST: ${{ secrets.GONKA_DEV_PREVIEW_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GONKA_DEV_PREVIEW_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.GONKA_DEV_PREVIEW_DEPLOY_PRIVATE_KEY }}
          DEPLOY_USER: preview
          PREVIEW_PROMETHEUS_ORIGIN: ${{ secrets.GONKA_DEV_PREVIEW_PROMETHEUS_ORIGIN }}
          PREVIEW_DEPLOY_ENV_FILE: ${{ runner.temp }}/gonka-dev-site-preview-deploy/config.env
        run: make -C trusted/net-deployment-runbook write-isolated-preview-deploy-env

      - name: Remove only this isolated preview
        env:
          GDC_SITE_PREVIEW_ENV_FILE: ${{ runner.temp }}/gonka-dev-site-preview-deploy/config.env
          preview_number: ${{ needs.cleanup-context.outputs.number }}
          preview_revision: ${{ needs.cleanup-context.outputs.head_sha }}
        run: make -C trusted/net-deployment-runbook remove-isolated-site-preview
