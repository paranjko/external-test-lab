name: Publish status-site preview

on:
  workflow_run:
    workflows: [Build status-site preview]
    types: [completed]
  pull_request_target:
    types: [closed, converted_to_draft, synchronize]

concurrency:
  group: gonka-dev-site-preview-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish-context:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pr.outputs.publish }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const number = context.payload.workflow_run.pull_requests[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              per_page: 100,
            });
            const eligible = pr.state === 'open' && !pr.draft &&
              pr.head.sha === context.payload.workflow_run.head_sha &&
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              files.some(({ filename }) => filename.startsWith('net-deployment-runbook/04-ops/site/'));
            core.setOutput('publish', String(eligible));
            core.setOutput('number', String(number));

  publish:
    needs: publish-context
    if: needs.publish-context.outputs.publish == 'true'
    name: Publish PR preview
    runs-on: ubuntu-latest
    environment:
      name: gonka-dev-site-preview
      url: http://gonka-dev.net/preview/${{ needs.publish-context.outputs.number }}/
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the verified static artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: gonka-dev-site-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gonka-dev-site-preview

      - name: Publish the static preview without executing artifact code
        env:
          DEPLOY_HOST: ${{ secrets.GONKA_DEV_SITE_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GONKA_DEV_SITE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.GONKA_DEV_SITE_DEPLOY_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.GONKA_DEV_SITE_DEPLOY_USER }}
        run: >-
          make -C net-deployment-runbook publish-site-release
          site_release_dir="$RUNNER_TEMP/gonka-dev-site-preview"
          site_publish_prefix="preview/${{ needs.publish-context.outputs.number }}"
          deploy_host="$DEPLOY_HOST" deploy_user="$DEPLOY_USER"

  cleanup-context:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      remove: ${{ steps.pr.outputs.remove }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const sameRepository = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const hasSiteChange = files.some(({ filename }) =>
              filename.startsWith('net-deployment-runbook/04-ops/site/'));
            const remove = sameRepository &&
              (context.payload.action === 'closed' || pr.draft || !hasSiteChange);
            core.setOutput('remove', String(remove));
            core.setOutput('number', String(pr.number));

  cleanup:
    needs: cleanup-context
    if: needs.cleanup-context.outputs.remove == 'true'
    name: Remove PR preview
    runs-on: ubuntu-latest
    environment: gonka-dev-site-preview
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Remove only this preview directory
        env:
          DEPLOY_HOST: ${{ secrets.GONKA_DEV_SITE_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GONKA_DEV_SITE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.GONKA_DEV_SITE_DEPLOY_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.GONKA_DEV_SITE_DEPLOY_USER }}
        run: >-
          make -C net-deployment-runbook remove-site-release
          site_publish_prefix="preview/${{ needs.cleanup-context.outputs.number }}"
          deploy_host="$DEPLOY_HOST" deploy_user="$DEPLOY_USER"
