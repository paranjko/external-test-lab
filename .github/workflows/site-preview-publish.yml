name: Publish status-site preview

on:
  workflow_run:
    workflows: [Build status-site preview]
    types: [completed]
  pull_request_target:
    types: [closed, converted_to_draft, synchronize]

concurrency:
  group: gonka-dev-site-preview-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: read

jobs:
  publish-context:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pr.outputs.publish }}
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C net-deployment-runbook site-preview-publish-context

  publish:
    needs: publish-context
    if: needs.publish-context.outputs.publish == 'true'
    name: Publish PR preview
    runs-on: ubuntu-latest
    environment:
      name: gonka-dev-site-preview
      url: https://gonka-dev.net/preview/${{ needs.publish-context.outputs.number }}/
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the verified static artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: gonka-dev-site-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gonka-dev-site-preview

      - name: Verify the artifact identity before deployment
        env:
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
          site_release_dir: ${{ runner.temp }}/gonka-dev-site-preview
        run: make -C net-deployment-runbook verify-site-preview-artifact

      - name: Publish the static preview without executing artifact code
        env:
          DEPLOY_HOST: ${{ secrets.GONKA_DEV_SITE_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GONKA_DEV_SITE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.GONKA_DEV_SITE_DEPLOY_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.GONKA_DEV_SITE_DEPLOY_USER }}
        run: >-
          make -C net-deployment-runbook publish-site-release
          site_release_dir="$RUNNER_TEMP/gonka-dev-site-preview"
          site_publish_prefix="preview/${{ needs.publish-context.outputs.number }}"
          deploy_host="$DEPLOY_HOST" deploy_user="$DEPLOY_USER"

      - name: Verify the live preview revision and payload digest
        env:
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
          site_publish_prefix: preview/${{ needs.publish-context.outputs.number }}
          site_release_dir: ${{ runner.temp }}/gonka-dev-site-preview
        run: make -C net-deployment-runbook verify-site-preview-live

      - name: Smoke-test the live preview in a cache-disabled browser
        env:
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
          site_publish_prefix: preview/${{ needs.publish-context.outputs.number }}
          site_release_dir: ${{ runner.temp }}/gonka-dev-site-preview
          site_origin: https://gonka-dev.net
        run: make -C net-deployment-runbook smoke-site-preview

      - name: Record the verified preview for the PR revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          preview_number: ${{ needs.publish-context.outputs.number }}
          preview_revision: ${{ needs.publish-context.outputs.head_sha }}
        run: make -C net-deployment-runbook record-site-preview-deployment

  cleanup-context:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      remove: ${{ steps.pr.outputs.remove }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C net-deployment-runbook site-preview-cleanup-context

  cleanup:
    needs: cleanup-context
    if: needs.cleanup-context.outputs.remove == 'true'
    name: Remove PR preview
    runs-on: ubuntu-latest
    environment: gonka-dev-site-preview
    steps:
      - name: Checkout the trusted publication revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Remove only this preview directory
        env:
          DEPLOY_HOST: ${{ secrets.GONKA_DEV_SITE_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GONKA_DEV_SITE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.GONKA_DEV_SITE_DEPLOY_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.GONKA_DEV_SITE_DEPLOY_USER }}
        run: >-
          make -C net-deployment-runbook remove-site-release
          site_publish_prefix="preview/${{ needs.cleanup-context.outputs.number }}"
          deploy_host="$DEPLOY_HOST" deploy_user="$DEPLOY_USER"
