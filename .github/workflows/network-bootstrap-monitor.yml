name: Network bootstrap monitor

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-bootstrap-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      chains: ${{ steps.inventory.outputs.chains }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        run: make -f .github/actions/gonkactl-bootstrap/Makefile inventory
  check:
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        chain: ${{ fromJSON(needs.inventory.outputs.chains) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check published bootstraps and every declared seed
        id: check
        uses: ./.github/actions/gonkactl-bootstrap
        with:
          chain-id: ${{ matrix.chain }}
          report: net-deployment-runbook/.data/bootstrap-monitor/${{ matrix.chain }}.json
      - name: Retain per-network results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bootstrap-monitor-${{ matrix.chain }}
          path: net-deployment-runbook/.data/bootstrap-monitor/${{ matrix.chain }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  notify:
    needs: check
    if: ${{ always() && needs.check.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telgram_gonka_dev_bot
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: bootstrap-monitor-*
          merge-multiple: true
          path: net-deployment-runbook/.data/bootstrap-monitor
      - name: Notify Telegram once per failed network
        env:
          GDC_TELEGRAM_BOT_TOKEN: ${{ secrets.GDC_TELEGRAM_BOT_TOKEN }}
          GDC_TELEGRAM_NOTIFICATION: ${{ vars.GDC_TELEGRAM_NOTIFICATION }}
        run: make -f .github/actions/gonkactl-bootstrap/Makefile notify
