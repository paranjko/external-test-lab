name: Build status-site preview

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'net-deployment-runbook/04-ops/site/**'
      - 'net-deployment-runbook/04-ops/render-ops.sh'
      - 'net-deployment-runbook/04-ops/network-observer.sh'
      - 'net-deployment-runbook/04-ops/network-observer-http.py'
      - 'net-deployment-runbook/04-ops/gdc-network-observer.service'
      - 'net-deployment-runbook/04-ops/gdc-network-observer.socket'
      - 'net-deployment-runbook/04-ops/gdc-network-observer@.service'
      - 'net-deployment-runbook/04-ops/gdc-network-observer.timer'
      - 'net-deployment-runbook/04-ops/Caddyfile'
      - 'net-deployment-runbook/04-ops/edge-node/PublicCaddyfile'
      - 'net-deployment-runbook/profiles/devnet-hadware.json'
      - 'net-deployment-runbook/scripts/build-site-js.sh'
      - 'net-deployment-runbook/scripts/serve-site.mjs'
      - 'net-deployment-runbook/scripts/test-serve-site.mjs'
      - 'net-deployment-runbook/scripts/test-chrome-devtools.mjs'
      - 'net-deployment-runbook/scripts/chrome-devtools.mjs'
      - 'net-deployment-runbook/scripts/test-production-network-browser.mjs'
      - 'net-deployment-runbook/scripts/test-site-snapshot-acceptance.mjs'
      - 'net-deployment-runbook/scripts/prepare-site-preview-artifact.sh'
      - 'net-deployment-runbook/scripts/prepare-isolated-site-preview-artifact.sh'
      - 'net-deployment-runbook/scripts/prepare-isolated-preview-ci.sh'
      - 'net-deployment-runbook/scripts/prepare-isolated-preview-ci-artifact.sh'
      - 'net-deployment-runbook/scripts/isolated-preview-publish.sh'
      - 'net-deployment-runbook/scripts/test-site-release-paths.sh'
      - 'net-deployment-runbook/scripts/test-site-preview-context.sh'
      - 'net-deployment-runbook/scripts/test-record-site-preview-deployment.sh'
      - 'net-deployment-runbook/scripts/test-isolated-preview-publish.sh'
      - 'net-deployment-runbook/scripts/test-preview-lifecycle.sh'
      - 'net-deployment-runbook/scripts/test-preview-status-renderer.sh'
      - 'net-deployment-runbook/scripts/test-preview-frontend-builder.sh'
      - 'net-deployment-runbook/scripts/test-isolated-preview-ci-artifact.sh'
      - 'net-deployment-runbook/scripts/test-validator-map-fixture.mjs'
      - 'net-deployment-runbook/package.json'
      - 'net-deployment-runbook/package-lock.json'
      - 'net-deployment-runbook/Makefile'
      - 'ops/preview/**'
      - '.github/workflows/site-preview-build.yml'
      - '.github/workflows/site-preview-publish.yml'

concurrency:
  group: gonka-dev-site-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Fork previews require a separate origin-security design and are intentionally skipped.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR revision without deployment credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22

      - name: Validate the untrusted preview source without deployment credentials
        env:
          # Lifecycle fixtures need an owned directory for their Unix socket,
          # not an operator login's /run/user directory on the hosted runner
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: >-
          make -C net-deployment-runbook
          test-gateway-site-state
          test-site-release-paths
          test-site-preview-context
          test-record-site-preview-deployment
          test-isolated-preview-publish
          test-preview-lifecycle
          test-preview-status-renderer
          test-preview-frontend-builder
          test-isolated-preview-ci-artifact

      - name: Run validator-map CDP regression
        run: >-
          make -C net-deployment-runbook test-validator-map
          map_evidence_dir="$RUNNER_TEMP/validator-map-regressions"

      - name: Build the source-bound preview artifact without deployment credentials
        env:
          PREVIEW_SOURCE_REPOSITORY: ${{ github.workspace }}
          PREVIEW_RELEASE_DIR: ${{ runner.temp }}/gonka-dev-site-preview
          PREVIEW_BACKEND_DIR: ${{ runner.temp }}/gonka-dev-site-preview-backend
          PREVIEW_INVENTORY: ${{ runner.temp }}/gonka-dev-site-preview-inventory.env
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          PREVIEW_REVISION: ${{ github.event.pull_request.head.sha }}
          PREVIEW_BACKEND_IMAGE: gdc-preview-backend-ci:${{ github.event.pull_request.head.sha }}
        run: make -C net-deployment-runbook prepare-isolated-preview-ci-artifact

      - name: Upload the source-bound preview artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gonka-dev-site-preview
          path: ${{ runner.temp }}/gonka-dev-site-preview
          if-no-files-found: warn
          retention-days: 2
