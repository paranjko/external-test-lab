name: Gonka PR unified lab release

on:
  workflow_dispatch:
    inputs:
      candidate_definition:
        description: Reviewed frozen candidate definition
        required: true
        default: gonka-pr-2008-unified.json
        type: choice
        options:
          - gonka-pr-2008-unified.json
          - gonka-pr-1792-faab10864ba5-unified.json
          - gonka-pr-1792-6f5c80d57142-unified.json
          - gonka-pr-1792-6f5c80d57142-r2-unified.json
          - gonka-pr-1792-95b95d2a03a1-unified.json
          - gonka-pr-1792-3c924cbf6fd9-unified.json
          - gonka-pr-1792-67230e4dcc0a-unified.json
          - gonka-pr-1792-d3d806a2c971-unified.json

permissions:
  contents: read

concurrency:
  group: gonka-pr-1792-unified-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'paranjko/external-test-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.3.0
        with:
          go-version: '1.25.9'
          cache: false
      - name: Install archive inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Run release checks
        run: make -C net-deployment-runbook test-devshard-release test-devshard-artifacts test-gonka-pr-unified-release
      - name: Fetch frozen public source
        env:
          GONKA_PR_UNIFIED_DEFINITION: ${{ inputs.candidate_definition }}
          DEVSHARD_SOURCE: ${{ runner.temp }}/gonka-pr-1792-source
        run: make -C net-deployment-runbook gonka-pr-unified-release-fetch
      - name: Build, verify and smoke complete candidate
        env:
          GONKA_PR_UNIFIED_DEFINITION: ${{ inputs.candidate_definition }}
          DEVSHARD_SOURCE: ${{ runner.temp }}/gonka-pr-1792-source
          DEVSHARD_UNIFIED_RELEASE_DIR: ${{ runner.temp }}/gonka-pr-1792-unified
        run: make -C net-deployment-runbook gonka-pr-unified-release-build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: gonka-pr-1792-unified-release
          path: ${{ runner.temp }}/gonka-pr-1792-unified/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'paranjko/external-test-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: gonka-pr-1792-unified-release
          path: ${{ runner.temp }}/gonka-pr-1792-unified
      - name: Install OCI registry transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify and publish the complete candidate
        env:
          GONKA_PR_UNIFIED_DEFINITION: ${{ inputs.candidate_definition }}
          GH_TOKEN: ${{ github.token }}
          DEVSHARD_UNIFIED_RELEASE_DIR: ${{ runner.temp }}/gonka-pr-1792-unified
        run: make -C net-deployment-runbook gonka-pr-unified-release-publish
