name: DevShard v6 artifact release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devshard-v6-artifact-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'paranjko/external-test-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Fetch frozen public source
        env:
          DEVSHARD_SOURCE: ${{ runner.temp }}/gonka-v6-artifact-source
        run: make -C net-deployment-runbook devshard-artifacts-fetch
      - name: Run artifact release checks
        env:
          DEVSHARD_SOURCE: ${{ runner.temp }}/gonka-v6-artifact-source
        run: make -C net-deployment-runbook test-devshard-artifacts
      - name: Build and verify complete selected bundle
        env:
          DEVSHARD_SOURCE: ${{ runner.temp }}/gonka-v6-artifact-source
          DEVSHARD_ARTIFACTS_DIR: ${{ runner.temp }}/devshard-v6-artifacts
        run: make -C net-deployment-runbook devshard-artifacts-build groups='manual-matrix dapi-edge'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          check-latest: false
      - name: Inspect image identities and smoke gateway entrypoints
        env:
          DEVSHARD_ARTIFACTS_DIR: ${{ runner.temp }}/devshard-v6-artifacts
        run: make -C net-deployment-runbook devshard-artifacts-smoke groups='manual-matrix dapi-edge'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: devshard-v6-artifacts
          path: ${{ runner.temp }}/devshard-v6-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'paranjko/external-test-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: devshard-v6-artifacts
          path: ${{ runner.temp }}/devshard-v6-artifacts/
      - name: Install OCI registry transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify exact bundle and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DEVSHARD_ARTIFACTS_DIR: ${{ runner.temp }}/devshard-v6-artifacts
        run: make -C net-deployment-runbook devshard-artifacts-publish groups='manual-matrix dapi-edge'
