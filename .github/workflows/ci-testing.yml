name: ci-testing

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SC1090: env files are sourced by a path known at run time; SC1007: the CDPATH= idiom
      - run: >-
          git ls-files -z 'testing/*.sh' testing/gonka-check/bin/gcheck
          | xargs -0 -r shellcheck --severity=warning --exclude=SC1090,SC1007

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.10'
      - run: git ls-files -z 'testing/*.py' | xargs -0 -r python -m py_compile

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install yamllint==1.38.0
      - run: >-
          git ls-files -z 'testing/*.yaml' 'testing/*.yml'
          | xargs -0 -r yamllint -d '{extends: relaxed, rules: {line-length: disable}}'

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.9'
          cache: false
      - run: |
          unformatted=$(git ls-files -z 'testing/*.go' | xargs -0 -r gofmt -l)
          [ -z "$unformatted" ] || { git ls-files -z 'testing/*.go' | xargs -0 gofmt -d; exit 1; }

  gcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.10'
      - run: testing/gonka-check/bin/gcheck selftest
