name: testing-gonka-check

on:
  push:
    branches:
      - main
    paths:
      - 'testing/gonka-check/**'
      - '.github/workflows/testing-gonka-check.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'testing/gonka-check/**'
      - '.github/workflows/testing-gonka-check.yml'
  workflow_dispatch:

concurrency:
  group: testing-gonka-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.10'
      - name: Self-test gonka-check
        run: testing/gonka-check/bin/gcheck selftest
