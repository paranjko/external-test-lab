name: Release gonkactl

on:
  push:
    tags: ['gonkactl-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing alpha release tag
        required: true
        type: choice
        options: [gonkactl-v1.0.0-alpha.3]
        default: gonkactl-v1.0.0-alpha.3

permissions:
  contents: read

concurrency:
  group: gonkactl-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: gonkactl/go.sum
      - name: Check source and installer
        run: make -C gonkactl check test-release
      - name: Build six archives and verify checksums
        run: make -C gonkactl release-archives
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: gonkactl-release
          path: build/gonkactl-release/
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: gonkactl-release
          path: build/gonkactl-release/
      - name: Install native release in an isolated home
        run: make -C gonkactl test-release-native

  publish:
    needs: [build, install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: gonkactl-release
          path: build/gonkactl-release/
      - name: Publish verified alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: make -C gonkactl release-publish
