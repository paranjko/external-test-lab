name: Net deployment runbook

on:
  push:
    paths:
      - 'net-deployment-runbook/**'
      - '.github/workflows/net-deployment-runbook.yml'
  pull_request:
    paths:
      - 'net-deployment-runbook/**'
      - '.github/workflows/net-deployment-runbook.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check runbook shell scripts
        run: make -C net-deployment-runbook shellcheck
