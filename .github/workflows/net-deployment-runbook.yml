name: Net deployment runbook

on:
  push:
    branches:
      - main
    paths:
      - 'net-deployment-runbook/**'
      - 'model/**'
      - 'broker-ops/**'
      - 'schema/**'
      - 'bootstrap/**'
      - 'ops/chore/setup-bootstrap-publisher.sh'
      - '.github/workflows/network-bootstrap-publish.yml'
      - '.github/workflows/network-bootstrap-monitor.yml'
      - '.github/workflows/net-deployment-runbook.yml'
      - '.github/workflows/devshard-release.yml'
      - '.github/workflows/devshard-artifacts-release.yml'
      - '.github/workflows/gonka-pr-unified-release.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'net-deployment-runbook/**'
      - 'model/**'
      - 'broker-ops/**'
      - 'schema/**'
      - 'bootstrap/**'
      - 'ops/chore/setup-bootstrap-publisher.sh'
      - '.github/workflows/network-bootstrap-publish.yml'
      - '.github/workflows/network-bootstrap-monitor.yml'
      - '.github/workflows/net-deployment-runbook.yml'
      - '.github/workflows/devshard-release.yml'
      - '.github/workflows/devshard-artifacts-release.yml'
      - '.github/workflows/gonka-pr-unified-release.yml'
  workflow_dispatch:

concurrency:
  group: net-deployment-runbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.route.outputs.release_only }}
      site_only: ${{ steps.route.outputs.site_only }}
      full: ${{ steps.route.outputs.full }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: files
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            await require('fs').promises.writeFile(
              `${process.env.RUNNER_TEMP}/changed-files.json`,
              JSON.stringify(files.map(file => file.filename)));
      - id: route
        run: make -C net-deployment-runbook ci-route changed_files="$RUNNER_TEMP/changed-files.json"

  release-contracts:
    needs: route
    if: github.event_name == 'pull_request' && needs.route.outputs.release_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test release contracts and declared dependencies
        run: make -C net-deployment-runbook test-command-dependency-contract test-ci-route test-devshard-release test-devshard-artifacts test-gonka-pr-unified-release

  shellcheck:
    needs: route
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.route.outputs.full == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check runbook shell scripts
        run: make -C net-deployment-runbook shellcheck shellcheck_shard=${{ matrix.shard }} shellcheck_shards=2

  runbook-contract-tests:
    needs: route
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.route.outputs.full == 'true')
    runs-on: ${{ vars.GDC_NODE4_RUNNER_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON('["self-hosted", "linux", "x64", "gdc-node4"]') || 'ubuntu-latest' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && 'gdc-node4-runner' || '' }}
    strategy:
      fail-fast: false
      matrix:
        group: [bootstrap, contracts, site, join, gateways]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install declared Python test dependencies
        if: matrix.group == 'gateways'
        run: make -C net-deployment-runbook install-python-test-dependencies
      - name: Verify CI group coverage
        run: make -C net-deployment-runbook test-ci-layout
      - name: Test runbook contracts
        run: make -C net-deployment-runbook test-ci-${{ matrix.group }}

  # Preserve the stable required-check name. Skipped/cancelled shards must
  # never turn a partially executed suite green.
  runbook-contracts:
    needs: [route, release-contracts, shellcheck, runbook-contract-tests, p0a-lifecycle, public-edge-integration, ownership, upstream-profiles]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const releaseOnly = '${{ needs.route.outputs.release_only }}' === 'true';
            const full = '${{ needs.route.outputs.full }}' === 'true';
            const failed = Object.entries(JSON.parse(process.env.NEEDS))
              .filter(([name, job]) => {
                if (name === 'route' || job.result === 'success') return false;
                if (job.result !== 'skipped') return true;
                if (full) return name !== 'release-contracts';
                if (releaseOnly) return name === 'release-contracts';
                return false;
              });
            if (failed.length) core.setFailed(`Required jobs did not pass: ${failed.map(([name]) => name).join(', ')}`);

  ownership:
    needs: route
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.route.outputs.full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test edge installation ownership in disposable root
        run: sudo make -C net-deployment-runbook test-edge-install-ownership
      - name: Test bootstrap publication with separate directory owners
        run: sudo make -C net-deployment-runbook test-bootstrap-publisher-ownership

  p0a-lifecycle:
    needs: route
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.route.outputs.full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test isolated P0-A JOIN and ML lifecycle
        run: make -C net-deployment-runbook test-gdc-p0a

  upstream-profiles:
    needs: route
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.route.outputs.full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout Gonka release refs for upstream audit
        uses: actions/checkout@v7.0.1
        with:
          repository: gonka-ai/gonka
          path: net-deployment-runbook/.data/upstream/gonka
          fetch-depth: 0
      - name: Verify release profiles against upstream
        run: make -C net-deployment-runbook verify-upstream-profiles

  public-edge-integration:
    needs: route
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.route.outputs.full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test public edge routing in disposable containers
        run: make -C net-deployment-runbook edge-integration
      - name: Test Bootstrap JOIN installation in a disposable root
        run: make -C net-deployment-runbook test-bootstrap-install
