name: Net deployment runbook

on:
  push:
    branches:
      - main
    paths:
      - 'net-deployment-runbook/**'
      - '.github/workflows/net-deployment-runbook.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'net-deployment-runbook/**'
      - '.github/workflows/net-deployment-runbook.yml'
  workflow_dispatch:

concurrency:
  group: net-deployment-runbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - id: filter
        uses: actions/github-script@v9.0.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('shell', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const shellRelevant = files.some(({ filename }) =>
              filename.endsWith('.sh') ||
              filename === 'net-deployment-runbook/Makefile' ||
              filename === '.github/workflows/net-deployment-runbook.yml'
            );
            core.setOutput('shell', String(shellRelevant));

  shellcheck:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check runbook shell scripts
        run: make -C net-deployment-runbook shellcheck

  runbook-contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.GDC_NODE4_RUNNER_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON('["self-hosted", "linux", "x64", "gdc-node4"]') || 'ubuntu-latest' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && 'gdc-node4-runner' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout pinned Gonka source
        uses: actions/checkout@v7.0.1
        with:
          repository: gonka-ai/gonka
          path: net-deployment-runbook/vendor/gonka
          fetch-depth: 0
      - name: Check runbook shell scripts on Node4
        if: runner.name == 'external-test-lab-gdc-node4'
        run: ./ops/github-actions-runner/run-shellcheck-native.sh net-deployment-runbook
      - name: Check runbook shell scripts on GitHub-hosted fallback
        if: runner.name != 'external-test-lab-gdc-node4'
        run: make -C net-deployment-runbook shellcheck
      - name: Test runbook contracts
        run: >-
          GONKA_UPSTREAM_WORKTREE="$GITHUB_WORKSPACE/net-deployment-runbook/vendor/gonka"
          make -C net-deployment-runbook test
