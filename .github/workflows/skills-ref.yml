name: skills-ref

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.github/workflows/skills-ref.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'skills/**'
      - '.github/workflows/skills-ref.yml'
  workflow_dispatch:

concurrency:
  group: skills-ref-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate Agent Skills
        run: |
          set -Eeuo pipefail
          npx --yes skills-ref@0.1.5 validate skills/openai-host-compat
          npx --yes skills-ref@0.1.5 validate skills/openai-responses-adapter
