name: skills-ref

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.github/workflows/skills-ref.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'skills/**'
      - '.github/workflows/skills-ref.yml'
  workflow_dispatch:

concurrency:
  group: skills-ref-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
      - name: Validate Agent Skills
        env:
          CI: 'true'
          # Official reference lib: https://github.com/agentskills/agentskills/tree/main/skills-ref
          SKILLS_REF_GIT: git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
          SKILLS_CLI: skills@1.5.23
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install "$SKILLS_REF_GIT"
          shopt -s nullglob
          found=0
          for skill_md in skills/*/SKILL.md; do
            skills-ref validate "$(dirname "$skill_md")"
            found=$((found + 1))
          done
          test "$found" -ge 1

          list_out="$(npx --yes "$SKILLS_CLI" add . --list -y)"
          printf '%s\n' "$list_out"
          # Name rows only. Descriptions mention the companion skill, so
          # substring grep would stay green if one package disappeared.
          printf '%s\n' "$list_out" | sed $'s/\x1b\\[[0-9;?]*[A-Za-z]//g' | awk '
          {
            line = $0
            sub(/^[^A-Za-z0-9_-]+/, "", line)
            if (line == "openai-host-compat") host = 1
            if (line == "openai-responses-adapter") resp = 1
          }
          END { if (!host || !resp) exit 1 }
          '
