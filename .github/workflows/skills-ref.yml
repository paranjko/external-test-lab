name: skills-ref

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'gonkactl-trace/README.md'
      - 'net-deployment-runbook/04-ops/site/trace/**'
      - '.github/workflows/skills-ref.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'skills/**'
      - 'gonkactl-trace/README.md'
      - 'net-deployment-runbook/04-ops/site/trace/**'
      - '.github/workflows/skills-ref.yml'
  workflow_dispatch:

concurrency:
  group: skills-ref-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Install Agent Skills validator
        run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Install integrity-locked catalog CLI
        run: make -C skills dependencies
      - name: Validate Agent Skills
        env:
          CI: 'true'
        run: make -C skills validate
