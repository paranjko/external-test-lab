name: Gonkactl native contracts

on:
  pull_request:
    paths:
      - 'gonkactl/**'
      - 'bootstrap/**'
      - '.github/actions/gonkactl-bootstrap/**'
      - '.github/workflows/gonkactl-native.yml'
      - '.github/workflows/network-bootstrap-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: gonkactl/go.sum
      - name: Native validation and isolated Action transport
        run: make -C gonkactl check test-release
