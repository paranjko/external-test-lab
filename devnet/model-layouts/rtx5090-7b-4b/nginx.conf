events {}
http {
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;
  upstream ml_api {
    zone ml_api 64k;
    server gdc-dual-4b-ml:8080 resolve;
  }
  upstream ml_inference {
    zone ml_inference 64k;
    server gdc-dual-4b-ml:5000 resolve;
  }
  server {
    listen 8080;
    client_max_body_size 0;
    proxy_connect_timeout 24h;
    proxy_send_timeout 24h;
    proxy_read_timeout 24h;
    location /v3.0.8/ { proxy_pass http://ml_api/; }
    location / { proxy_pass http://ml_api; }
  }
  server {
    listen 5000;
    client_max_body_size 0;
    proxy_connect_timeout 24h;
    proxy_send_timeout 24h;
    proxy_read_timeout 24h;
    location /v3.0.8/api/ { proxy_pass http://ml_api/api/; }
    location /v3.0.8/ { proxy_pass http://ml_inference/; }
    location / { proxy_pass http://ml_inference; }
  }
}
