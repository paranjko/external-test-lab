# Candidate gateway on the existing wrapping; render separately on each host.
name: ${V6_GATEWAY_PROJECT:?set an independent project name}
services:
  gateway:
    image: ghcr.io/paranjko/external-test-lab/devshard-gateway@sha256:a8739adf01784115cd1d636105d93bae4ee4184d9cddb373de9678c2a7d39423
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - path: ${V6_GATEWAY_SECRET_FILE:?set the private gateway env file}
        format: raw
    environment:
      DEVSHARD_PORT: "8080"
      DEVSHARDS_JSON: "[]"
      DEVSHARD_CHAIN_ID: gonka-devnet-community
      DEVSHARD_CHAIN_RPC: http://node:26657/
      DEVSHARD_CHAIN_GRPC: node:9090
      DEVSHARD_PUBLIC_API: http://api:9000
      DEVSHARD_MODEL: Qwen/Qwen3-0.6B
      DEVSHARD_ROUTE_PREFIX: /devshard/v6
      DEVSHARD_STORAGE_DIR: /root/.devshardctl
      DEVSHARD_STORAGE_MODE: sqlite
      DEVSHARD_TX_GAS_LIMIT: "700000"
      DEVSHARD_ALLOW_PRIVATE_ADDRESSES: "true"
      DEVSHARD_STATS_ENABLED: "true"
      DEVSHARD_STATS_PORT: "9091"
      DEVSHARD_ESCROW_ROTATION_ENABLED: "false"
      DEVSHARD_ESCROW_ROTATION_SETTLEMENT_ENABLED: "false"
      DEVSHARD_CHAT_CACHE_MAX_BYTES: "1"
      # Small DevNet weights round the upstream default (5) down to zero.
      GATEWAY_MAX_CONCURRENT_REQUESTS_PER_10000_WEIGHT: "25"
      # Section 1 must use HTTP/1.1. The upstream Compose default enables H2.
      DEVSHARD_RPC_H2_UPGRADE: "false"
    ports:
      - "127.0.0.1:${V6_GATEWAY_API_PORT:?set a free API port}:8080"
      - "127.0.0.1:${V6_GATEWAY_STATS_PORT:?set a free stats port}:9091"
    volumes:
      - state:/root/.devshardctl
    networks:
      - host-private
    labels:
      org.gonka.test-lab.scope: v6-preparation
volumes:
  state:
    name: ${V6_GATEWAY_VOLUME:?set a fresh version-specific volume}
networks:
  host-private:
    external: true
    name: ${V6_GATEWAY_NETWORK:?set the existing host network}
